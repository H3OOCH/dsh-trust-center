name: Bug report / 缺陷
description: Something in Trust Center is broken or misleading.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove tokens, private paths, and full private Skill bodies before posting.
        For security vulnerabilities, use GitHub Security Advisories instead.
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: "0.2.1-rc.2"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: dsh-trust-center version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Screenshots, rule IDs, or snippets with secrets removed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed tokens, private paths, and full private Skill bodies.
          required: true
        - label: This is not a security vulnerability report.
          required: true
